name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build microservice
        working-directory: ./microservices/device-service
        run: mvn clean package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: microservice-jar
          path: microservices/device-service/target/device-service-1.0.0-SNAPSHOT.jar

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        working-directory: ./microservices/device-service
        run: mvn test

  sonarqube:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        working-directory: ./microservices/device-service
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=iot-security-device-service \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

  owasp:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@v4
        with:
          project: 'iot-security-device-service'
          path: './microservices/device-service'
          format: 'HTML,JSON'
          out: './reports'

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: ./reports/dependency-check-report.*

  trivy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ./microservices/device-service
        run: docker build -t iot-security-device-service:1.0.0-SNAPSHOT .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'iot-security-device-service:1.0.0-SNAPSHOT'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: ./trivy-report.txt
        if: always()

  package-lambdas:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Package alert-processor Lambda
        working-directory: ./lambdas/alert-processor
        run: |
          pip install -r requirements.txt -t .
          zip -r alert-processor.zip .

      - name: Package image-processor Lambda
        working-directory: ./lambdas/image-processor
        run: |
          pip install -r requirements.txt -t .
          zip -r image-processor.zip .

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-artifacts
          path: |
            lambdas/alert-processor/alert-processor.zip
            lambdas/image-processor/image-processor.zip

  deploy:
    runs-on: ubuntu-latest
    needs: [test, sonarqube, owasp, trivy, package-lambdas]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public # Use 'private' for real AWS ECR, 'public' for LocalStack

      - name: Build and push Docker image
        working-directory: ./microservices/device-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: iot-security-device-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Deploy to EKS with Helm
        working-directory: ./microservices/device-service/chart
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: iot-security-device-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws eks update-kubeconfig --name dev-iot-security-cluster --region eu-west-1
          helm upgrade --install device-service . \
            --namespace iot-security \
            --set image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG

  notify-slack:
    runs-on: ubuntu-latest
    needs: [test, sonarqube, owasp, trivy, deploy]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.27.0
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          text: |
            *CI/CD Pipeline*: ${{ job.status }}
            *Repository*: ${{ github.repository }}
            *Commit*: ${{ github.sha }}
            *SonarQube*: Check results at ${{ secrets.SONAR_HOST_URL }}
            *OWASP*: Report uploaded as artifact (owasp-report)
            *Trivy*: Report uploaded as artifact (trivy-report)
            *Deploy*: ${{ needs.deploy.result }} (Helm release: device-service)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}